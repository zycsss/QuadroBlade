[controller]
file = "rl_scene.py"

[deploy]
check_drone_start_pos = true
check_race_track = true
real_track_objects = true
[[deploy.drones]]
id = 2
channel = 80
drone = "cf21B_500"

[env]
control_mode = "attitude"
freq = 50
id = "DroneRacing-v0"
seed = -1
sensor_range = 0.7

[sim]
attitude_freq = 500
camera = -1
drone = "cf21B_500"
dynamics = "first_principles"
freq = 500
render = true
[[sim.cam_config]]
distance = 5.0
azimuth = 180.0
elevation = -25.0
lookat = [ 0.0, 0.0, 0.0,]

[env.track]
gate_order = [ 1, 2, 3, 4, 2,]
randomize = false
[[env.track.drones]]
pos = [ -1.2334356307983398, 0.58469557762146, 0.05022352561354637,]
rpy = [ -0.17961131373722128, 0.09636270207175723, -2.7207945821524424,]
vel = [ 0, 0, 0,]
ang_vel = [ 0, 0, 0,]

[[env.track.gates]]
