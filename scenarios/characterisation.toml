# Scenario characterisation

# Measures what the drone can actually do, instead of what the planner hopes it can do. One
# manoeuvre is flown per run, defined by `scenario` below and documented in
# `lsy_drone_racing.control.scenario_path`. Driven by `scripts/characterize.py`, which rewrites the
# scenario and the start position per run; running this file directly flies the default scenario.

# Everything here is deterministic on purpose: no track randomization and no disturbances, so a
# measurement can be repeated and compared.
[controller]
file = "scenario_controller.py" # A measuring instrument, never used for racing.
# The manoeuvre: <name> [key=value ...]. Geometry: length, radius, angle (degrees), offset, at,
# x, y, z, straight_in, straight_out, turn_left. Speed: `speed` obeys the curvature limit,
# `overload` ignores it and is how the real lateral acceleration limit is found.
scenario = "line length=3 speed=2.0"
# Wall of time after which the run is cut short, seconds.
scenario_timeout = 20.0
# The racing controller's own gains, so the measured envelope is the one the races are flown with.
w_speed_gate = 4.0
a_lat_max = 8.0
v_max = 3.5
replan_slowdown_time = 0.3

[deploy]
### Settings only relevant for deployment
check_race_track = false
check_drone_start_pos = false
real_track_objects = true

[[deploy.drones]]
id = 10
channel = 100
drone = "cf21B_500"

[sim]
dynamics = "first_principles"
drone = "cf21B_500"
freq = 500
attitude_freq = 500
render = false
camera = -1
[[sim.cam_config]]
distance = 5.0
azimuth = 180.0
elevation = -25.0
lookat = [0.0, 0.0, 0.0]

[env]
id = "DroneRacing-v0"
seed = 0
freq = 50
sensor_range = 0.7
control_mode = "attitude"

[env.track]
randomize = false

# The gates are parked in the arena corners: a scenario is a free-space manoeuvre, and a gate in the
# way would either be struck or pass the drone through it and end the episode early. The order still
# has to be valid for the environment to build.
gate_order = [1, 2, 3, 4]
[[env.track.gates]]
pos = [2.2, -1.3, 0.7]
rpy = [0.0, 0.0, 0.0]
[[env.track.gates]]
pos = [2.2, 1.3, 0.7]
rpy = [0.0, 0.0, 0.0]
[[env.track.gates]]
pos = [-2.2, -1.3, 0.7]
rpy = [0.0, 0.0, 0.0]
[[env.track.gates]]
pos = [-2.2, 1.3, 0.7]
rpy = [0.0, 0.0, 0.0]

# One obstacle, parked in the corner. The environment requires at least one, and a scenario is a
# free-space manoeuvre, so it is kept out of every default scenario's reach.
[[env.track.obstacles]]
pos = [2.35, 0.0, 1.55]

[[env.track.drones]]
pos = [-1.5, 0.0, 1.0]
rpy = [0.0, 0.0, 0.0]
vel = [0, 0, 0]
ang_vel = [0, 0, 0]

[env.track.safety_limits]
pos_limit_low = [-2.5, -1.5, -1e-3]
pos_limit_high = [2.5, 1.5, 2.0]
